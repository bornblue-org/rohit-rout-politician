services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rohit}
      POSTGRES_USER: ${DB_USER:-rohit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - rohit-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rohit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-rohit}
      DATABASE_USER: ${DB_USER:-rohit}
      DATABASE_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      UPLOAD_DIR: /app/uploads
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS in .env}
    volumes:
      - rohit-uploads:/app/uploads

  # Named rohit-frontend so it cannot clash with the other site's "frontend" on the shared proxy network.
  # There is no caddy here: the single caddy in the bp-ronge stack serves both domains (see its Caddyfile).
  rohit-frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - default
      - web

volumes:
  rohit-pg:
  rohit-uploads:

networks:
  web:
    external: true
